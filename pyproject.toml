[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosine"
version = "0.1.0"
description = "Mnemosine historical canon and deterministic story engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
  "canon",
  "engine",
  "orchestrator",
  "server",
  "compliance",
  "control_room",
  "tests",
]
